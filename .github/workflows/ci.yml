name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — typecheck · hex-lint · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worthygoals-frontend-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worthygoals-frontend-app/package-lock.json

      - name: Install dependencies
        run: npm ci --fetch-retries 5 --fetch-retry-mintimeout 20000 --fetch-retry-maxtimeout 120000

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Hex-lint (no raw colour literals)
        run: bash scripts/hex-lint.sh

      - name: Unit tests
        run: npx jest --ci --passWithNoTests

  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend — lint · typecheck · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worthygoals-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worthygoals-backend/package-lock.json

      - name: Install dependencies
        run: npm ci --fetch-retries 5 --fetch-retry-mintimeout 20000 --fetch-retry-maxtimeout 120000

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --passWithNoTests --testPathIgnorePatterns='.*\\.e2e-spec\\.ts$'

      # The build was never gated, which is how the dist/main.js vs dist/src/main.js
      # mismatch (and the missing personality YAMLs) survived to Sep 2026.
      - name: Build
        run: npm run build

      - name: Verify runnable artifact
        run: |
          test -f dist/main.js || { echo "::error::dist/main.js missing — Dockerfile CMD and start:prod both run 'node dist/main'"; exit 1; }
          test -d dist/core/personalities/data || { echo "::error::personality YAMLs not next to the loader — PersonalityLoader will throw ENOENT at boot"; exit 1; }

      - name: Docker build
        run: docker build -t worthygoals-backend:ci .

      # No dependency gate existed, which is how @nestjs/common sat two years
      # behind on a published RCE advisory. Critical-only for now: the express /
      # path-to-regexp / multer chain needs a @nestjs/platform-express major and
      # is scheduled separately (tracker I4 · TD-6).
      - name: Dependency audit (critical)
        run: npm audit --audit-level=critical

  # ── API contract ─────────────────────────────────────────────────────────
  contract:
    name: API contract — spec matches the backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worthygoals-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worthygoals-backend/package-lock.json

      - name: Install dependencies
        run: npm ci --fetch-retries 5 --fetch-retry-mintimeout 20000 --fetch-retry-maxtimeout 120000

      # openapi.json was hand-authored and had drifted to documenting 8 of 45
      # operations. The old `ci:check-api` only asserted that the generated
      # client matched the committed spec — it never compared the spec to the
      # backend, so it passed against a spec describing 17% of the API.
      #
      # spec:export runs in Nest preview mode, so it registers every route
      # without instantiating a provider: no database, no Redis, no real
      # credentials. These values only have to satisfy Joi.
      - name: Regenerate the OpenAPI spec
        env:
          NODE_ENV: local
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USERNAME: ci
          DB_PASSWORD: ci
          DB_NAME: ci
          AWS_REGION: eu-north-1
          AWS_ACCESS_KEY_ID: ci
          AWS_SECRET_ACCESS_KEY: ci
          AWS_COGNITO_USER_POOL_ID: ci
          AWS_COGNITO_APP_CLIENT_ID: ci
          OPENAI_API_KEY: ci
        run: npm run spec:export

      - name: Fail if the committed spec is stale
        run: |
          if ! git diff --exit-code --stat openapi.json; then
            echo "::error::openapi.json does not match the backend. Run 'npm run spec:export' and commit the result."
            exit 1
          fi

  # ── Eval harness ─────────────────────────────────────────────────────────
  eval:
    name: Eval harness — personality tone gate
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: worthygoals-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worthygoals-backend/package-lock.json

      - name: Install dependencies
        run: npm ci --fetch-retries 5 --fetch-retry-mintimeout 20000 --fetch-retry-maxtimeout 120000

      - name: Run eval (dry-run when no API key)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not set — running dry-run validation"
            npm run eval:dry
          else
            npm run eval
          fi
