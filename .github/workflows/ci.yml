name: CI

# Release gate only: runs on PRs into master. Day-to-day checks run locally in
# husky — pre-commit (lint · typecheck · hex-lint · eval dry-run) and pre-push
# (unit tests · build · API contract · dependency audit). CI keeps only what a
# laptop can't do well: the Docker image, real-Postgres schema drift and the
# paid live eval. The critical audit stays too, because advisories land without
# any code change (proxy-addr, Oct 2026).
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend — build · docker · audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worthygoals-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worthygoals-backend/package-lock.json

      - name: Install dependencies
        run: npm ci --fetch-retries 5 --fetch-retry-mintimeout 20000 --fetch-retry-maxtimeout 120000

      # The build was never gated, which is how the dist/main.js vs dist/src/main.js
      # mismatch (and the missing personality YAMLs) survived to Sep 2026.
      - name: Build
        run: npm run build

      - name: Verify runnable artifact
        run: |
          test -f dist/main.js || { echo "::error::dist/main.js missing — Dockerfile CMD and start:prod both run 'node dist/main'"; exit 1; }
          test -d dist/core/personalities/data || { echo "::error::personality YAMLs not next to the loader — PersonalityLoader will throw ENOENT at boot"; exit 1; }

      - name: Docker build
        run: docker build -t worthygoals-backend:ci .

      # No dependency gate existed, which is how @nestjs/common sat two years
      # behind on a published RCE advisory. Critical-only for now: the express /
      # path-to-regexp / multer chain needs a @nestjs/platform-express major and
      # is scheduled separately (tracker I4 · TD-6).
      - name: Dependency audit (critical)
        run: npm audit --audit-level=critical

  # ── Schema drift ─────────────────────────────────────────────────────────
  schema:
    name: Schema — entities match the migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worthygoals-backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: ci
      DB_PASSWORD: ci
      DB_NAME: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worthygoals-backend/package-lock.json

      - name: Install dependencies
        run: npm ci --fetch-retries 5 --fetch-retry-mintimeout 20000 --fetch-retry-maxtimeout 120000

      - name: Apply every migration to an empty database
        run: npm run typeorm:run

      - name: Revert and re-apply the newest migration
        run: npm run typeorm:revert && npm run typeorm:run

      # Entity decorators disagreed with the shipped DDL on nearly every table
      # (timestamp vs timestamptz, json vs jsonb, enum vs varchar, unnamed vs
      # named constraints), so `typeorm:generate` — the documented workflow —
      # emitted a destructive, table-rewriting migration. --check fails the
      # build if the entities and the migrations disagree again.
      - name: Fail if entities and migrations have drifted
        run: npx ts-node -r tsconfig-paths/register ./node_modules/typeorm/cli.js migration:generate src/database/migrations-pg/SchemaDrift --check -d src/database/dataSource.ts

  # ── Eval harness ─────────────────────────────────────────────────────────
  eval:
    name: Eval harness — personality tone gate
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worthygoals-backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worthygoals-backend/package-lock.json

      - name: Install dependencies
        run: npm ci --fetch-retries 5 --fetch-retry-mintimeout 20000 --fetch-retry-maxtimeout 120000

      # Live only when the change can move a persona's voice (prompts, persona
      # YAML, the AI gateway, the golden sets). Everything else gets the free
      # dry run, which still validates every golden file.
      - name: Run eval (live only for persona-touching changes)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY not set — dry-run validation"
            npm run eval:dry
          elif git diff --name-only "$BASE" HEAD -- src/core/personalities src/core/ai eval | grep -q .; then
            npm run eval
          else
            echo "No persona-touching changes — dry-run validation"
            npm run eval:dry
          fi
