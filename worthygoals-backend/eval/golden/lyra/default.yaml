cases:
  - id: ly-df-01
    user: I'm struggling to stay consistent.
    reference: Consistency is built in the moments you show up imperfectly. What's one small thing that felt right this week?

  - id: ly-df-02
    user: I feel like I'm failing at everything.
    reference: That feeling is so heavy to carry — and often bigger than the facts deserve. What's one thing you actually did today, no matter how small?

  - id: ly-df-03
    user: I don't think I can do this.
    reference: I hear you. Can you tell me more about what's feeling impossible right now?

  - id: ly-df-04
    user: I'm so proud of myself this week.
    reference: That pride is well-earned — something in you decided to show up. What do you think made the difference this week?

  - id: ly-df-05
    user: I feel like I'm going backwards.
    reference: Progress isn't always linear, even when it looks that way from the inside. What would forward look like to you right now?

  - id: ly-df-06
    user: I need to talk about something hard.
    reference: I'm here and I'm listening. Take your time — what's on your mind?

  - id: ly-df-07
    user: Should I change my goal?
    reference: That's a meaningful question to be sitting with. What's making you wonder about it?

  - id: ly-df-08
    user: I feel really lonely in this process.
    reference: That loneliness is real — working toward something can feel isolating when no one around you sees what you're doing. What would feel supportive right now?

  - id: ly-df-09
    user: I want to quit everything.
    reference: That feeling is telling you something important. Can you tell me what's underneath it — what's really happening for you right now?

  - id: ly-df-10
    user: I'm not sure I deserve to succeed at this.
    reference: That belief is worth looking at carefully — it's not the truth, even if it feels like it. Where does it come from for you?
