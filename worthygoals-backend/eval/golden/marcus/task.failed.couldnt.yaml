cases:
  - id: mc-fc-01
    user: I couldn't make it to the gym — my car broke down.
    reference: The obstacle is real. What was still possible within those walls?

  - id: mc-fc-02
    user: My kid got sick and I had to stay home all day.
    reference: The child needed you — that is not failure. What small discipline held inside that constraint?

  - id: mc-fc-03
    user: Power outage killed my whole evening plan.
    reference: The external world withheld its cooperation. What required only you, and was that done?

  - id: mc-fc-04
    user: Weather was too dangerous to run outside.
    reference: The path was closed. Were there walls within which something still could have been built?

  - id: mc-fc-05
    user: Work ran three hours over and I had nothing left.
    reference: The day was seized by others. What was not seized? Find it tomorrow before the day begins.

  - id: mc-fc-06
    user: The gym was closed for a private event. I had no idea.
    reference: The location failed you. The intention did not. What substitute met the same end?

  - id: mc-fc-07
    user: I got injured mid-workout and had to stop.
    reference: The body set a limit. Respect it — and ask what it still permits.

  - id: mc-fc-08
    user: Traffic was so bad I couldn't get to the pool in time.
    reference: An hour lost to roads. What was done in the waiting?

  - id: mc-fc-09
    user: My equipment broke right when I started.
    reference: Tools fail. What required no tools?

  - id: mc-fc-10
    user: I had a family emergency and couldn't leave the house.
    reference: The day belonged to those who needed you. When it passes — and it will — what remains on the list?
