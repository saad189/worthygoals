# fly.toml — Worthy Goals API (staging)
# Run `fly launch` once to create the app, then use `flyctl deploy` to update.
# Set secrets via: fly secrets set KEY=value

app = 'worthygoals-api'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = "prod"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
